[project]
name = "ragmon"
version = "0.1.0"
description = "Production-Ready PDF RAG AI Agent with Inngest, Qdrant, FastAPI, Gemini CLI OAuth, and Streamlit"
authors = [
    { name = "Kkevinsm", email = "karashii866@gmail.com" }
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.165.0",
    "inngest>=0.5.20",
    "llama-index-core>=0.14.26",
    "llama-index-readers-file>=0.8.0",
    "numpy<2",
    "pyarrow<18",
    "pydantic>=2.14.4",
    "pypdfium2>=5.15.2",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "sentence-transformers<3.4",
    "streamlit>=1.67.0",
    "streamlit-js-eval>=1.0.0",
    "transformers<4.46",
    "uvicorn>=0.54.0",
]

[project.scripts]
ragmon = "ragmon:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
